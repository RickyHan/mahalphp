<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>관리자 로그인 · 민원 자동처리 시스템</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23FEE500%22/%3E%3Cpath d=%22M16 7C10.5 7 6 10.5 6 14.8c0 2.8 1.9 5.3 4.7 6.6l-1 3.7 4.4-2.9c.6.1 1.2.1 1.9.1 5.5 0 10-3.5 10-7.8S21.5 7 16 7z%22 fill=%22%233C1E1E%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/admin/static/admin.css?v=3.1">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-logo ms fill" aria-hidden="true">chat_bubble</span>
      <span><strong>민원 자동처리 시스템</strong><small>카카오톡 민원 통합 관제 · 관리자 로그인</small></span>
    </div>
    <p id="login-error" class="login-error" role="alert" hidden></p>
    <form method="post" action="/admin/login" class="login-form">
      <label>아이디<input name="username" autocomplete="username" required autofocus></label>
      <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn btn-primary">로그인</button>
    </form>
  </main>
  <script src="/admin/static/login.js"></script>
</body>
</html>
